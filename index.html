<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XAUUSD Journal</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f4f7;--card:#fff;--bd:#e2e5ec;--tx:#171a21;--mut:#6b7280;--ac:#0d9488;--up:#15803d;--dn:#dc2626;--upb:rgba(34,197,94,.16);--dnb:rgba(239,68,68,.15)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--card:#12151c;--bd:#222733;--tx:#e8eaf0;--mut:#8b93a5;--ac:#2dd4bf;--up:#4ade80;--dn:#f87171;--upb:rgba(34,197,94,.22);--dnb:rgba(239,68,68,.22)}}
:root[data-theme="dark"]{--bg:#0b0d12;--card:#12151c;--bd:#222733;--tx:#e8eaf0;--mut:#8b93a5;--ac:#2dd4bf;--up:#4ade80;--dn:#f87171;--upb:rgba(34,197,94,.22);--dnb:rgba(239,68,68,.22)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;font-size:14px}
.w{max-width:1100px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo i{width:34px;height:34px;border:2px solid var(--ac);color:var(--ac);border-radius:9px;display:grid;place-items:center;font-style:normal}
.logo span{color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 11px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#04231f;font-weight:700}
button.d{color:var(--dn)}
input,select,textarea{width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 1.1fr;gap:4px}
.hd{color:var(--mut);font-size:11px;text-align:center;padding:2px}
.c{min-height:82px;border:1px solid var(--bd);border-radius:8px;padding:5px;position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.c.e{border:0;cursor:default}.c.w{background:var(--upb);border-color:var(--up)}.c.l{background:var(--dnb);border-color:var(--dn)}
.c.k{cursor:default;background:transparent;justify-content:center;text-align:center}
.dn{font-size:11px;color:var(--mut)}.c b{font-size:13px}.c small{font-size:10px;color:var(--mut)}
.c img{position:absolute;right:4px;bottom:4px;width:36px;height:28px;object-fit:cover;border-radius:4px;border:1px solid var(--bd)}
.up{color:var(--up)}.dnc{color:var(--dn)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.st div{display:flex;justify-content:space-between;border-bottom:1px solid var(--bd);padding:4px 0;font-size:13px}
.st span{color:var(--mut)}
svg{width:100%;height:auto;display:block}
.tw{overflow-x:auto}
.hint{font-size:12px;color:var(--mut)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}
#m>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:560px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
label{font-size:11px;color:var(--mut);display:block;margin-bottom:2px}
.emo button{font-size:20px;padding:4px 9px}.emo button.on{border-color:var(--ac);background:var(--upb)}
.tl{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:13px}
@media(max-width:640px){.c{min-height:56px;padding:3px}.c img,.c small{display:none}.cal{gap:2px}.st{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
<div class="top">
<div class="logo"><i>X</i>XAUUSD <span>Journal</span></div>
<div class="row"><button class="p" id="add">+ เพิ่มเทรด</button><button id="exp">ส่งออก CSV</button><button id="imp">นำเข้า CSV</button><input type="file" id="file" accept=".csv" hidden><button id="th">🌓</button></div>
</div>

<div class="card">
<div class="row" style="justify-content:space-between;margin-bottom:8px">
<div class="row"><button id="pv">‹</button><b id="mt" style="min-width:140px;text-align:center"></b><button id="nx">›</button><button id="td">วันนี้</button></div>
<label style="display:flex;gap:6px;align-items:center;margin:0">ทุนเริ่มต้น $<input type="number" id="bal" style="width:100px"></label>
</div>
<div class="cal" id="cal"></div>
</div>

<div class="g2">
<div class="card"><div class="row" style="justify-content:space-between"><h2>สถิติ</h2><select id="sc" style="width:auto"><option value="m">เดือนนี้</option><option value="a">ทั้งหมด</option></select></div><div class="st" id="st"></div></div>
<div class="card"><h2>Equity Curve (ทุนสะสมทั้งหมด)</h2><div id="eq"></div></div>
</div>
<div class="card"><h2>กำไร/ขาดทุนรายวัน (เดือนที่เลือก)</h2><div id="bars"></div></div>
<div class="hint" style="padding-bottom:12px">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ ควรกด “ส่งออก CSV” สำรองไว้เป็นระยะ (รูปแนบไม่รวมในไฟล์ CSV) · 1 ล็อต = 100 ออนซ์</div>
</div>

<div id="m"><div>
<div class="row" style="justify-content:space-between;margin-bottom:8px"><b id="mh">บันทึกเทรด</b><button id="cx">✕</button></div>
<div id="dl"></div>
<div class="f">
<div><label>วันที่</label><input type="date" id="d"></div>
<div><label>ฝั่ง</label><select id="side"><option value="L">Buy</option><option value="S">Sell</option></select></div>
<div><label>ราคาเข้า</label><input type="number" step="0.01" id="en"></div>
<div><label>ราคาออก</label><input type="number" step="0.01" id="ex"></div>
<div><label>ล็อต</label><input type="number" step="0.01" id="lot" value="0.01"></div>
<div><label>Stop Loss</label><input type="number" step="0.01" id="sl"></div>
<div><label>ค่าคอม/สเปรด ($)</label><input type="number" step="0.01" id="fee" value="0"></div>
<div><label>กลยุทธ์/แท็ก</label><input id="tag"></div>
<div><label>ทำตามแผนไหม</label><select id="plan"><option value="">-</option><option value="y">ตามแผน</option><option value="n">ไม่ตามแผน</option></select></div>
</div>
<label style="margin-top:8px">อารมณ์</label><div class="row emo" id="emo"><button data-e="😄">😄</button><button data-e="🤩">🤩</button><button data-e="😐">😐</button><button data-e="😰">😰</button><button data-e="😡">😡</button></div>
<label style="margin-top:8px">โน้ต</label><textarea id="note" rows="2"></textarea>
<label style="margin-top:8px">แนบรูปกราฟ</label><input type="file" id="img" accept="image/*"><img id="pre" style="max-width:100%;max-height:140px;margin-top:6px;display:none;border-radius:8px">
<div class="row" style="margin-top:12px"><button class="p" id="sv">บันทึก</button><button id="cl">ล้างฟอร์ม</button></div>
</div></div>

<script>
var K="xauj1",db={bal:1000,t:[]},cur=new Date(),eid=null,pim="",pem="";cur.setDate(1);
try{var r=localStorage.getItem(K);if(r)db=JSON.parse(r)}catch(e){}
try{var th=localStorage.getItem("xauth");document.documentElement.setAttribute("data-theme",th||"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}
function $(i){return document.getElementById(i)}
function alert(t){var d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:#04231f;font-weight:700;padding:10px 16px;border-radius:10px;z-index:99;max-width:90%;text-align:center";document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
function save(){try{localStorage.setItem(K,JSON.stringify(db));return 1}catch(e){alert("พื้นที่เก็บข้อมูลเต็ม ลองส่งออก CSV สำรองแล้วลบรูปแนบบางส่วน");return 0}}
function p2(n){return n<10?"0"+n:""+n}
function pl(t){return (t.side=="L"?t.ex-t.en:t.en-t.ex)*t.lot*100-(t.fee||0)}
function rr(t){if(!t.sl)return null;var k=Math.abs(t.en-t.sl)*t.lot*100;return k?pl(t)/k:null}
function f(n,d){return (n<0?"-":"")+Math.abs(n).toFixed(d==null?2:d)}
function sg(n){return (n>=0?"+":"-")+"$"+Math.abs(n).toFixed(2)}
function cl(n){return n>=0?"up":"dnc"}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ym(){return cur.getFullYear()+"-"+p2(cur.getMonth()+1)}
function sorted(a){return a.slice().sort(function(x,y){return x.d<y.d?-1:x.d>y.d?1:x.id-y.id})}

function render(){
 $("bal").value=db.bal;
 var y=cur.getFullYear(),m=cur.getMonth(),nd=new Date(y,m+1,0).getDate(),off=new Date(y,m,1).getDay(),k=ym();
 $("mt").textContent=cur.toLocaleDateString("th-TH",{month:"long",year:"numeric"});
 var day={};
 sorted(db.t).forEach(function(t){if(t.d.slice(0,7)!=k)return;var x=day[t.d]=day[t.d]||{p:0,n:0};x.p+=pl(t);x.n++;if(t.img)x.img=t.img;if(t.emo)x.emo=t.emo});
 var h=["อา","จ","อ","พ","พฤ","ศ","ส","สัปดาห์"].map(function(s){return '<div class="hd">'+s+"</div>"}).join(""),wk=0,wn=0,tot=Math.ceil((off+nd)/7)*7;
 for(var i=0;i<tot;i++){
  var dn=i-off+1;
  if(dn>=1&&dn<=nd){var ds=k+"-"+p2(dn),x=day[ds];if(x){wk+=x.p;wn+=x.n}
   h+='<div class="c '+(x?(x.p>=0?"w":"l"):"")+'" data-d="'+ds+'"><span class="dn">'+dn+"</span>"+(x?'<b class="'+cl(x.p)+'">'+sg(x.p)+"</b><small>"+x.n+" เทรด "+(x.emo||"")+"</small>"+(x.img?'<img src="'+x.img+'">':""):"")+"</div>"}
  else h+='<div class="c e"></div>';
  if(i%7==6){h+='<div class="c k">'+(wn?'<b class="'+cl(wk)+'">'+sg(wk)+"</b><small>"+wn+" เทรด</small>":'<small>-</small>')+"</div>";wk=0;wn=0}
 }
 $("cal").innerHTML=h;
 stats();charts(day,nd,k);
}

function stats(){
 var L=sorted(db.t);if($("sc").value=="m")L=L.filter(function(t){return t.d.slice(0,7)==ym()});
 var n=L.length,w=0,gw=0,gl=0,eq=0,pk=0,dd=0,lg=0,rs=[],dd2={};
 L.forEach(function(t){var p=pl(t);if(p>0){w++;gw+=p}else gl-=p;eq+=p;if(eq>pk)pk=eq;if(pk-eq>dd)dd=pk-eq;if(t.side=="L")lg++;var r=rr(t);if(r!=null)rs.push(r);dd2[t.d]=(dd2[t.d]||0)+p});
 var ds=Object.keys(dd2).map(function(d){return dd2[d]}),tp=gw-gl,pf=gl?gw/gl:(gw?"∞":0);
 var R=[["กำไรสุทธิ",'<b class="'+cl(tp)+'">'+sg(tp)+"</b>"],["จำนวนเทรด",n],["Win rate",n?f(w/n*100,1)+"%":"-"],["Profit factor",typeof pf=="string"?pf:f(pf)],
 ["กำไรเฉลี่ย","$"+f(w?gw/w:0)],["ขาดทุนเฉลี่ย","$"+f(n-w?gl/(n-w):0)],["Expectancy","$"+f(n?tp/n:0)],["R เฉลี่ย",rs.length?f(rs.reduce(function(a,b){return a+b},0)/rs.length):"-"],
 ["วันที่ดีที่สุด",ds.length?'<b class="up">'+sg(Math.max.apply(0,ds))+"</b>":"-"],["วันที่แย่ที่สุด",ds.length?'<b class="dnc">'+sg(Math.min.apply(0,ds))+"</b>":"-"],
 ["Max drawdown","$"+f(dd)],["Buy / Sell",lg+" / "+(n-lg)],["วันทำกำไร",ds.filter(function(v){return v>0}).length+"/"+ds.length]];
 $("st").innerHTML=R.map(function(r){return "<div><span>"+r[0]+"</span><span style='color:var(--tx)'>"+r[1]+"</span></div>"}).join("");
}

function charts(day,nd,k){
 var e=db.bal,p=[e];sorted(db.t).forEach(function(t){e+=pl(t);p.push(e)});
 if(p.length<2)$("eq").innerHTML='<div class="hint">จะแสดงกราฟเมื่อมีเทรดแล้ว</div>';
 else{var W=600,H=200,mn=Math.min.apply(0,p),mx=Math.max.apply(0,p);if(mx==mn){mx++;mn--}
  var pt=p.map(function(v,i){return [(6+i*(W-12)/(p.length-1)).toFixed(1),(H-18-(v-mn)/(mx-mn)*(H-30)).toFixed(1)]});
  var ln=pt.map(function(a){return a.join(",")}).join(" ");
  $("eq").innerHTML='<svg viewBox="0 0 '+W+" "+H+'"><polygon points="6,'+(H-18)+" "+ln+" "+(W-6)+","+(H-18)+'" fill="var(--ac)" opacity=".15"/><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="'+ln+'"/><text x="6" y="12" font-size="11" fill="var(--mut)">$'+f(mx,0)+'</text><text x="6" y="'+(H-4)+'" font-size="11" fill="var(--mut)">$'+f(mn,0)+"</text></svg>"}
 var ks=Object.keys(day).sort();
 if(!ks.length){$("bars").innerHTML='<div class="hint">ยังไม่มีเทรดในเดือนนี้</div>';return}
 var W=700,H=180,mid=H/2,mx=Math.max.apply(0,ks.map(function(d){return Math.abs(day[d].p)}))||1,bw=(W-20)/nd,s='<svg viewBox="0 0 '+W+" "+H+'"><line x1="0" x2="'+W+'" y1="'+mid+'" y2="'+mid+'" stroke="var(--bd)"/>';
 ks.forEach(function(d){var v=day[d].p,hh=Math.abs(v)/mx*(mid-14),i=+d.slice(8)-1,x=10+i*bw;
  s+='<rect x="'+(x+1).toFixed(1)+'" y="'+(v>=0?mid-hh:mid).toFixed(1)+'" width="'+Math.max(bw-2,2).toFixed(1)+'" height="'+Math.max(hh,1).toFixed(1)+'" rx="2" fill="'+(v>=0?"var(--up)":"var(--dn)")+'"/><text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-2)+'" font-size="9" text-anchor="middle" fill="var(--mut)">'+(i+1)+"</text>"});
 $("bars").innerHTML=s+"</svg>";
}

function clr(){eid=null;pim="";pem="";["en","ex","sl","tag","note"].forEach(function(i){$(i).value=""});$("lot").value="0.01";$("fee").value="0";$("plan").value="";$("side").value="L";$("img").value="";$("pre").style.display="none";$("mh").textContent="บันทึกเทรด";emo()}
function emo(){[].forEach.call($("emo").children,function(b){b.className=b.getAttribute("data-e")==pem?"on":""})}
function open(ds){clr();$("d").value=ds||new Date().toISOString().slice(0,10);dl();$("m").style.display="flex"}
function dl(){
 var d=$("d").value,L=sorted(db.t).filter(function(t){return t.d==d});
 $("dl").innerHTML=L.length?'<h2>เทรดของวันที่ '+d+"</h2>"+L.map(function(t){var p=pl(t);return '<div class="tl"><span>'+(t.side=="L"?"Buy":"Sell")+" "+t.lot+" · "+t.en+"→"+t.ex+' · <b class="'+cl(p)+'">'+sg(p)+"</b> "+(t.emo||"")+'</span><span class="row"><button data-ed="'+t.id+'">แก้ไข</button><button class="d" data-rm="'+t.id+'">ลบ</button></span></div>'}).join(""):"";
}
$("add").onclick=function(){open()};
$("cx").onclick=function(){$("m").style.display="none"};
$("cl").onclick=function(){var d=$("d").value;clr();$("d").value=d};
$("d").onchange=dl;
$("emo").onclick=function(e){var v=e.target.getAttribute("data-e");if(v){pem=pem==v?"":v;emo()}};
$("cal").onclick=function(e){var c=e.target.closest(".c[data-d]");if(c)open(c.getAttribute("data-d"))};
$("dl").onclick=function(e){
 var ed=e.target.getAttribute("data-ed"),rm=e.target.getAttribute("data-rm");
 if(rm){var b=e.target;if(b.getAttribute("data-c")){db.t=db.t.filter(function(t){return String(t.id)!==String(rm)});if(String(eid)===String(rm))clr();save();render();dl();alert("ลบเทรดแล้ว")}else{b.setAttribute("data-c","1");b.textContent="ยืนยันลบ?";b.style.background="var(--dn)";b.style.color="#fff"}return}
 if(ed){var t=db.t.filter(function(x){return x.id==ed})[0];if(!t)return;eid=t.id;pim=t.img||"";pem=t.emo||"";
  $("side").value=t.side;$("en").value=t.en;$("ex").value=t.ex;$("lot").value=t.lot;$("sl").value=t.sl||"";$("fee").value=t.fee||0;$("tag").value=t.tag||"";$("note").value=t.note||"";$("plan").value=t.plan||"";
  $("mh").textContent="แก้ไขเทรด";if(pim){$("pre").src=pim;$("pre").style.display="block"}emo()}
};
$("img").onchange=function(){
 var fl=this.files[0];if(!fl)return;var fr=new FileReader();
 fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,480/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pim=c.toDataURL("image/jpeg",.6);$("pre").src=pim;$("pre").style.display="block"};im.src=fr.result};
 fr.readAsDataURL(fl);
};
$("sv").onclick=function(){
 var en=parseFloat($("en").value),ex=parseFloat($("ex").value),lot=parseFloat($("lot").value);
 if(isNaN(en)||isNaN(ex)||isNaN(lot)||lot<=0||!$("d").value){alert("กรุณากรอกวันที่ ราคาเข้า ราคาออก และล็อตให้ครบ");return}
 var o={id:eid||Date.now(),d:$("d").value,side:$("side").value,en:en,ex:ex,lot:lot,sl:parseFloat($("sl").value)||0,fee:parseFloat($("fee").value)||0,tag:$("tag").value,note:$("note").value,plan:$("plan").value,emo:pem,img:pim};
 if(eid)db.t=db.t.map(function(t){return t.id==eid?o:t});else db.t.push(o);
 if(save()){var d=o.d;cur=new Date(+d.slice(0,4),+d.slice(5,7)-1,1);clr();$("d").value=d;render();dl()}
};
$("pv").onclick=function(){cur.setMonth(cur.getMonth()-1);render()};
$("nx").onclick=function(){cur.setMonth(cur.getMonth()+1);render()};
$("td").onclick=function(){cur=new Date();cur.setDate(1);render()};
$("sc").onchange=stats;
$("bal").onchange=function(){db.bal=parseFloat(this.value)||0;save();render()};
$("th").onclick=function(){var d=document.documentElement,c=d.getAttribute("data-theme")=="dark"?"light":"dark";d.setAttribute("data-theme",c);try{localStorage.setItem("xauth",c)}catch(e){}};
$("exp").onclick=function(){
 var c="date,side,entry,exit,lot,sl,fee,tag,note,emo,plan\n"+db.t.map(function(x){return [x.d,x.side,x.en,x.ex,x.lot,x.sl,x.fee,x.tag,x.note,x.emo,x.plan].map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
 var a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent("\ufeff"+c);a.download="xauusd-journal.csv";a.click();
};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){
 var fr=new FileReader();fr.onload=function(){
  var rows=[],cu=[],v="",q=false,s=fr.result.replace(/^\ufeff/,"");
  for(var i=0;i<s.length;i++){var ch=s[i];
   if(q){if(ch=='"'){if(s[i+1]=='"'){v+='"';i++}else q=false}else v+=ch}
   else if(ch=='"')q=true;else if(ch==","){cu.push(v);v=""}
   else if(ch=="\n"){cu.push(v);rows.push(cu);cu=[];v=""}else if(ch!="\r")v+=ch}
  if(v||cu.length){cu.push(v);rows.push(cu)}
